<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Software - Formulário Validado</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <div class="container">
        <h2>Teste de Software - Formulário Validado</h2>
        <div class="card">

            <button onclick="validar()">Enviar</button>
            <p id="mensagem"></p>
        </div>
    </div>
    <script src="script/script.js"></script>
</body>
</html>
